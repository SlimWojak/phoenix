spec_vs_actual:
  - feature: FSM_states_transitions
    spec_says: "DRAFT->ACTIVE->(EXPIRED|REVOKED|HALTED), HALTED->REVOKED, terminal=[EXPIRED,REVOKED]."
    actual: "VALID_TRANSITIONS in governance/lease.py matches design exactly; terminal set is EXPIRED+REVOKED."
    status: REAL
    evidence:
      - docs/canon/designs/CARTRIDGE_AND_LEASE_DESIGN_v1.0.md:667-755
      - governance/lease.py:76-84
      - tests/test_lease/test_state_machine.py:76-160

  - feature: FSM_documentation_consistency
    spec_says: "HALTED is non-terminal and only transitions to REVOKED."
    actual: "leases/README shows 'REVOKED -> HALTED (terminal)' which conflicts with runtime FSM."
    status: STALE_DOC
    evidence:
      - leases/README.md:26-34
      - governance/lease.py:76-84

  - feature: insertion_step_1_2_3
    spec_says: "Load YAML, schema validation, hash verification."
    actual: "CartridgeLoader.validate performs Pydantic schema + required invariants + hash verify/auto-compute."
    status: REAL
    evidence:
      - governance/insertion.py:1-27
      - governance/cartridge.py:138-173
      - tests/test_lease/test_insertion.py:164-235

  - feature: insertion_step_2b_dependency_hash_check
    spec_says: "Environment/dependency hash validation before slot."
    actual: "No dependency/environment hash check in runtime insertion path."
    status: DESIGNED_NOT_BUILT
    evidence:
      - docs/canon/designs/CARTRIDGE_AND_LEASE_DESIGN_v1.0.md:788-794
      - governance/insertion.py:248-342
      - governance/cartridge.py:138-173

  - feature: insertion_step_3_4_6_guard_scans
    spec_says: "Forbidden pattern scan + cabinet validation + guard_dog full_scan as separate steps."
    actual: "Collapsed into CartridgeLinter.lint() called once at step 4."
    status: REAL_COLLAPSED
    evidence:
      - docs/canon/designs/CARTRIDGE_AND_LEASE_DESIGN_v1.0.md:796-833
      - governance/insertion.py:271-276
      - governance/cartridge.py:273-329

  - feature: insertion_step_5_index_update
    spec_says: "Update index.yaml."
    actual: "CartridgeRegistry maintains in-memory dict/list; no index.yaml exists under cartridges/."
    status: DIVERGED
    evidence:
      - docs/canon/designs/CARTRIDGE_AND_LEASE_DESIGN_v1.0.md:819-822
      - governance/cartridge.py:188-246
      - cartridges tree: no index.yaml

  - feature: insertion_step_7_calibration_smoke
    spec_says: "Auto-shadow calibration and emit CALIBRATION_BEAD."
    actual: "CalibrationBead type exists but no runtime creation path or tests."
    status: DESIGNED_NOT_BUILT
    evidence:
      - docs/canon/designs/CARTRIDGE_AND_LEASE_DESIGN_v1.0.md:834-848
      - governance/lease_types.py:533-548
      - tests/test_lease/*: no calibration references

  - feature: insertion_step_7_halt_gate_S55
    spec_says: "S55 requires HALT.signal check before capital action."
    actual: "insertion._complete_insertion calls check_halt_signal() before activate_lease; rollback on halt."
    status: REAL
    evidence:
      - governance/insertion.py:324-342
      - tests/test_halt_signal.py:138-166
      - git governance/insertion.py: b08de2c (2026-02-25)

  - feature: insertion_step_8_ready_beads
    spec_says: "Insertion completion emits insertion and activation beads."
    actual: "CartridgeInsertionBead and LeaseActivationBead are emitted, but only to in-memory emitters/collections."
    status: PARTIAL
    evidence:
      - governance/cartridge.py:236-246
      - governance/lease.py:202-211
      - governance/lease.py:58-73

  - feature: ceremony_weekly_review_attestation
    spec_says: "next_review_due and attestation/ceremony enforceable; overdue blocks execution."
    actual: "Fields exist in LeaseGovernance schema, but no enforcement logic and no ceremony engine."
    status: STUB_SCHEMA_ONLY
    evidence:
      - docs/canon/designs/CARTRIDGE_AND_LEASE_DESIGN_v1.0.md:552-588
      - docs/canon/designs/CARTRIDGE_AND_LEASE_DESIGN_v1.0.md:1045-1110
      - governance/lease_types.py:406-417
      - tests/test_lease/*: no ceremony/attestation tests

  - feature: PERISH_BY_DEFAULT
    spec_says: "renewal_type must be PERISH; no auto-renew."
    actual: "LeaseDuration.renewal_type is Literal[RenewalType.PERISH]; registry marks ENFORCED with no tests."
    status: REAL_SCHEMA_ENFORCED
    evidence:
      - governance/lease_types.py:376-378
      - INVARIANT_REGISTRY.yaml:178-185

  - feature: lease_persistence_layout
    spec_says: "leases active/expired/revoked structure for audit trail."
    actual: "leases/ has README only; no persistence directories/files and no serializer in code."
    status: DESIGNED_NOT_BUILT
    evidence:
      - leases/README.md:7-13
      - leases tree: README only
      - governance/lease.py:539-599

