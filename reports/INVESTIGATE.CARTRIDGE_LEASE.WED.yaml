summary:
  real_count: 7
  stub_count: 4
  t1_risks:
    - "S55 gap: LeaseStateMachine.activate() does not call check_halt_signal despite explicit brief requirement."
    - "Capital path gap: execution/asia_scalp.py declares halt invariant but has no halt gate call."
    - "Ceremony governance (attestation/next_review_due blocking) is schema-only; no runtime enforcement."
    - "Lease/cartridge forensic beads are transient (in-memory only), undermining durable auditability."
  t2_risks:
    - "Design step 2b dependency hash and step 7 calibration smoke are not implemented."
    - "Design 'index.yaml' slot model diverges from in-memory registry implementation."
    - "leases/README state diagram is stale/misleading vs runtime FSM."
    - "manifest_writer fallback paths can mask lease subsystem faults as ABSENT/GREEN."