  drawer_config:
    CONTEXT:
      htf_bias_required: true
      requires_worldstate: true

    MONITORING:
      kill_zone_sweep_required: true

    SETUP:
      pda_in_ote_zone: true
      displacement_confirmed: true

    EXECUTION:
      mss_required: true
      entry_type: limit_at_pda

    MANAGEMENT:
      target_reachable: true
      min_rr: 2.0

  primitive_set: [FVG, MSS, Displacement, OrderBlock, IFVG, BPR, OTE]
  state_detection_required: true
  permitted_phases: [EXPANSION, RETRACE]
  permitted_directions: [WITH_EXPANSION, COUNTER_ALLOWED]
  authority_timeframes: [1D, 4H, 1H]
  stale_after_bars: 1

constitutional:
  invariants_required:
    - INV-NO-UNSOLICITED
    - INV-HALT-1
    - INV-ATTR-CAUSAL-BAN
    - INV-SHADOW-MODE-RESPECTED
  forbidden_patterns:
