  version: "0.1.0"
  author: CTO
  description: |
    HTF Directional strategy — trend-following on higher timeframe structure.
    Uses Dexter DIAGNOSTIC_SIGNAL WorldState for bias + structure assessment.
    SCAFFOLD ONLY — predicates await Olya calibration.
  created_at: "2026-03-23T00:00:00Z"
